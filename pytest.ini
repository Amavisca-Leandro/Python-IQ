[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    projects

markers =
    smoke: Critical path tests that must pass (fast, ~2 minutes)
    regression: Full regression test suite (comprehensive, ~15 minutes)
    backend: API and backend service tests
    frontend: UI and frontend tests using Playwright
    slow: Tests that take longer than 5 seconds to execute
    integration: End-to-end integration tests with database and external services
    database: Tests that require database connection
    api: API endpoint tests
    ui: User interface tests
    auth: Authentication and authorization tests
    crud: CRUD operation tests (Create, Read, Update, Delete)
    validation: Data validation and schema tests
    filters: Query parameter and filtering tests
    performance: Performance and response time tests
    bdd: BDD tests written in Gherkin syntax
    get: HTTP GET request tests
    post: HTTP POST request tests
    put: HTTP PUT request tests
    delete: HTTP DELETE request tests
    filter: Query filtering and parameter tests
    list: List/collection endpoint tests
    nested: Nested resource endpoint tests
    data_creation: Tests for creating test data in database
    data_validation: Tests for validating database data
    data_cleanup: Tests demonstrating automatic test data cleanup
    query: Database query tests
    advanced: Advanced database operations
    bulk: Bulk data operations
    profile: User profile related tests
    state: Database state validation tests
    end_to_end: End-to-end integration tests
    negative: Negative test cases
    id: ID-based query tests
    api_integration: Tests combining API and database operations
    table: Tests using data tables
    data_flow: Tests demonstrating data flow through steps
    multi_step: Tests with multiple sequential steps
    data_sharing: Tests demonstrating context data sharing
    complex: Complex workflow tests
    multiple_entities: Tests with multiple database entities
    sequential: Sequential operation tests
    full_cycle: Full CRUD cycle tests
    context: Tests demonstrating bdd_context usage
    error_handling: Error handling and validation tests
    critical: Critical tests that must pass (blocking)
    authentication: Authentication and login tests
    navigation: Navigation and page transition tests
    security: Security-related tests

    # SRS Project Markers
    middleware: Middleware layer tests
    email: Email service tests
    sms: SMS service tests
    notification: Notification service tests
    api_keys: API Keys management tests
    templates: Templates management tests
    sending: Email sending tests (sync)
    queue: Email queue tests (async)
    helpers: Helper functions tests
    sync: Synchronous operations
    async: Asynchronous operations
    bulk: Bulk email operations
    scheduled: Scheduled emails
    template: Template-based emails
    attachment: Emails with attachments
    html: HTML emails
    tracking: Email tracking (opens, clicks)
    filter: Filter and query tests
    status: Status check tests
    cancel: Cancellation tests
    priority: Priority queue tests
    variables: Template variables tests
    unit: Unit tests (no external dependencies)
    contract: Contract tests (schema validation)
    high: High priority (P1)
    medium: Medium priority (P2)
    low: Low priority (P3)
    fast: Tests that take < 5 seconds

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    -p no:warnings
    --alluredir=reports/allure-results
    --clean-alluredir

timeout = 300
timeout_method = thread

# Allure Report Configuration
# Allure results are automatically saved to reports/allure-results/
# The --clean-alluredir flag ensures old results are cleaned before each run
# 
# Generate static HTML report:
#   allure generate --clean reports/allure-results -o reports/allure-report
#   Or use: scripts/gerar_allure.bat (Windows) or scripts/gerar_allure.sh (Unix)
#
# Start Allure server with live reload:
#   allure serve reports/allure-results -p 4040
#   Or use: scripts/allure_server.bat (Windows) or scripts/allure_server.sh (Unix)
#
# Allure decorators for enhanced reporting:
#   @allure.feature("Feature Name") - Group tests by feature
#   @allure.story("User Story") - Group tests by user story
#   @allure.severity(allure.severity_level.CRITICAL) - Set test severity
#   with allure.step("Step description"): - Add detailed test steps
#   allure.attach(data, name, attachment_type) - Attach files/screenshots

# HTML Report Configuration (pytest-html)
# To generate HTML report, add to command line:
# pytest tests/jsonplaceholder/ --html=reports/jsonplaceholder_report.html --self-contained-html

# Parallel Execution (requires pytest-xdist plugin)
# Run with: pytest -n auto
# -n auto will use number of CPU cores

# Coverage Options (requires pytest-cov plugin)
# --cov=core
# --cov-report=html:reports/coverage
# --cov-report=term-missing

env_files =
    .env

# BDD Configuration (pytest-bdd)
# NOTA: Features agora estão organizadas por escopo (integration, não bdd)
# bdd_features_base_dir = projects/srs/middleware/email/tests/integration

# BDD Tag-to-Marker Conversion
# ==============================
# pytest-bdd automatically converts Gherkin tags to pytest markers.
# Tags in feature files (e.g., @smoke, @api, @crud) are converted to markers
# that can be used with pytest's -m option for filtering tests.
#
# Tag Conversion Rules:
# - Tags in feature files use @ prefix: @smoke, @backend, @api
# - pytest-bdd converts them to markers without the @ prefix
# - All markers must be registered in the markers section above
# - Tags can be applied at Feature level (applies to all scenarios) or Scenario level
#
# Example Feature File:
#   @smoke @backend @api
#   Feature: JSONPlaceholder Posts API
#     
#     @crud @get
#     Scenario: Get all posts
#       When I send a GET request to "/posts"
#       Then the response status code should be 200
#
# Running BDD Tests with Markers:
# - Run all smoke tests:           pytest -m smoke
# - Run all API tests:              pytest -m api
# - Run smoke AND backend tests:   pytest -m "smoke and backend"
# - Run smoke OR regression tests: pytest -m "smoke or regression"
# - Run API but not slow tests:    pytest -m "api and not slow"
# - Run only BDD tests:             pytest -m bdd
# - Run BDD CRUD tests:             pytest -m "bdd and crud"
#
# Common BDD Tag Combinations Used in Feature Files:
# - @smoke @backend @api          - Critical API tests (fast, must pass)
# - @database @integration        - Database integration tests
# - @integration @end_to_end      - Full workflow tests
# - @crud @get                    - HTTP GET CRUD operations
# - @crud @post                   - HTTP POST CRUD operations
# - @crud @put                    - HTTP PUT CRUD operations
# - @crud @delete                 - HTTP DELETE CRUD operations
# - @validation @get              - Response validation tests
# - @filter @get                  - Query parameter filtering tests
# - @data_creation @smoke         - Database data creation tests
# - @data_validation @api_integration - API and database validation
# - @complex @data_flow @multiple_entities - Complex multi-step workflows
#
# BDD-Specific Markers:
# The following markers are commonly used in BDD scenarios:
# - bdd: All BDD tests (automatically applied by pytest-bdd)
# - data_flow: Tests demonstrating data flow through Given-When-Then steps
# - multi_step: Tests with multiple sequential API/database operations
# - data_sharing: Tests demonstrating bdd_context usage for sharing data
# - context: Tests showing how context passes data between steps
# - multiple_entities: Tests working with multiple database records
# - sequential: Tests with sequential operations and validations
# - full_cycle: Complete CRUD cycle tests
# - error_handling: Error handling and edge case validation
# - table: Tests using Gherkin data tables
# - profile: User profile related tests
# - state: Database state validation tests
# - id: ID-based query tests
# - api_integration: Tests combining API calls and database operations
#
# Marker Filtering Examples for BDD:
# - pytest tests/bdd/ -m "smoke"                    # Run all smoke BDD tests
# - pytest tests/bdd/ -m "crud and get"             # Run all GET CRUD tests
# - pytest tests/bdd/ -m "database and not slow"    # Run fast database tests
# - pytest tests/bdd/ -m "api and validation"       # Run API validation tests
# - pytest tests/bdd/ -m "integration and end_to_end" # Run E2E integration tests
# - pytest tests/bdd/features/api/ -m "post"        # Run all POST request tests
# - pytest tests/bdd/features/database/ -m "data_creation" # Run data creation tests
#
# Integration with Existing Framework:
# - All existing pytest markers work seamlessly with BDD scenarios
# - BDD tests appear in Test Explorer alongside traditional pytest tests
# - Allure reports show BDD scenarios with their tags as labels
# - Parallel execution (pytest -n auto) works with BDD tests
# - All pytest plugins (allure, xdist, timeout) are compatible with BDD
#
# Best Practices:
# 1. Apply feature-level tags (@smoke, @backend, @api) to the Feature line
# 2. Apply scenario-specific tags (@crud, @get, @validation) to Scenario lines
# 3. Use consistent tag naming across feature files
# 4. Register all tags as markers in the markers section above
# 5. Use marker expressions to run targeted test suites
# 6. Combine tags to create meaningful test categories (e.g., @smoke @crud @get)
