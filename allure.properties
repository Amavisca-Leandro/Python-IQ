# Allure Report Configuration
# This file configures Allure report generation and integration with external tools

# Report Title and Description
allure.report.title=Python Test Automation Framework - Test Results
allure.report.description=Comprehensive test automation results for backend (API) and frontend (UI) tests

# Link Patterns for Issue Tracking
# Configure links to Jira tickets and test management tools
# Replace with your actual Jira/TMS URLs
allure.link.issue.pattern=https://jira.example.com/browse/{}
allure.link.tms.pattern=https://jira.example.com/browse/{}
allure.link.custom.pattern=https://example.com/{}

# Categories Configuration
# Categories are defined in categories.json file
# This allows grouping of test failures by type:
# - Product Defects (AssertionError)
# - Test Defects (AttributeError, TypeError, ValueError)
# - Infrastructure Issues (ConnectionError, TimeoutError)
# - Database Issues (DatabaseError, OperationalError)
# - Authentication Failures (401, 403)
# - Validation Errors (ValidationError)
# - Flaky Tests (intermittent failures)

# Environment Information
# Additional environment info can be added via environment.properties
# or programmatically using set_environment_info() from allure_helpers

# Executor Information
# Information about test execution environment (CI/CD)
# Can be set via executor.json file or programmatically

# History Trends
# Allure automatically maintains history if previous results are available
# Use --clean-alluredir flag to clear history

# Report Language
# Default is English, can be changed to other supported languages
# allure.report.language=en

# Epic/Feature/Story Organization
# Use decorators in tests:
# @allure.epic("User Management")
# @allure.feature("User Registration")
# @allure.story("As a user, I want to register with email")

# Severity Levels
# Use @allure.severity(allure.severity_level.CRITICAL)
# Levels: BLOCKER, CRITICAL, NORMAL, MINOR, TRIVIAL
