[pytest]
# Pytest Configuration for SRS Project

# Test paths
testpaths =
    middleware
    backend
    frontend
    integration

# Python files and functions
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers - Organize tests by layer and service
markers =
    # Layers
    middleware: Middleware layer tests
    backend: Backend API tests
    frontend: Frontend UI tests
    integration: End-to-end integration tests

    # Middleware Services
    email: Email service tests
    sms: SMS service tests
    notification: Notification service tests

    # Email Service Modules
    api_keys: API Keys management tests
    templates: Templates management tests
    sending: Email sending tests (sync)
    queue: Email queue tests (async)
    helpers: Helper functions tests

    # Email Features
    crud: CRUD operations
    sync: Synchronous operations
    async: Asynchronous operations
    bulk: Bulk email operations
    scheduled: Scheduled emails
    template: Template-based emails
    attachment: Emails with attachments
    html: HTML emails
    tracking: Email tracking (opens, clicks)
    filter: Filter and query tests
    status: Status check tests
    cancel: Cancellation tests
    priority: Priority queue tests
    validation: Input validation tests
    security: Security tests
    negative: Negative test cases
    variables: Template variables tests

    # Test Types
    smoke: Smoke tests (critical path)
    regression: Regression test suite
    api: API tests
    ui: UI tests
    bdd: BDD tests with Gherkin
    unit: Unit tests (no external dependencies)
    contract: Contract tests (schema validation)

    # Priority
    critical: Critical tests (P0)
    high: High priority (P1)
    medium: Medium priority (P2)
    low: Low priority (P3)

    # Speed
    slow: Tests that take > 30 seconds
    fast: Tests that take < 5 seconds

# BDD Configuration
# NOTA: Features agora estão em tests/integration/features (não bdd)
# bdd_features_base_dir = middleware/email/tests/integration

# Allure Configuration
alluredir = ../../reports/allure-results/srs

# Output
console_output_style = progress
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout
timeout = 300

# Parallel execution (use with pytest-xdist)
# addopts = -n auto
